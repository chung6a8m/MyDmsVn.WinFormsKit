name: Build WinFormsKit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Build libraries, galleries and test assemblies for both targets
        shell: pwsh
        run: ./build.ps1 -Configuration Release
      - name: Ensure restore leaves the committed dependency locks unchanged
        shell: pwsh
        run: |
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'NuGet lock files changed during restore.' }
          $vendorChanges = git -C vendor/sourcegrid status --porcelain
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect SourceGrid worktree.' }
          if ($vendorChanges) { throw 'SourceGrid worktree changed during build.' }
